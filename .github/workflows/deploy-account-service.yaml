name: Deploy Account Service

on:
  push:
    branches:
      - main
    paths:
      - 'account-service/**'
      # DEViation from tutorial: account-service depends on common-lib
      # (com.saswat.lovable:common-lib:1.0.0) and installs it below, so a common-lib
      # change must trigger a rebuild or the image ships with a stale lib. Drop this line
      # if you want byte-exact fidelity with the tutorial, which omits it.
      - 'common-lib/**'

env:
  SERVICE_NAME: account-service
  IMAGE_NAME: saspal02/lovable-account-service

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # JDK 25, not the tutorial's 21: every pom sets <java.version>25</java.version>,
      # so compiling on 21 fails with "invalid target release: 25".
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and Install Common Lib
        working-directory: ./common-lib
        run: ./mvnw clean install -DskipTests

      - name: Build Jar
        working-directory: ./${{ env.SERVICE_NAME }}
        run: ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # jib-maven-plugin 3.5.2 is configured in this service's pom (base image, ports,
      # target repository), so only the tags are passed here. Credentials come from the
      # login step above, which writes ~/.docker/config.json that jib reads.
      - name: Build and Push Docker Image
        working-directory: ./${{ env.SERVICE_NAME }}
        run: |
          ./mvnw -q jib:build \
            -Djib.to.image=docker.io/${{ env.IMAGE_NAME }} \
            -Djib.to.tags=${{ github.sha }},latest
