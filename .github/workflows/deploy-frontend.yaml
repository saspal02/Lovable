name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'lovable-frontend/**'

env:
  SERVICE_NAME: lovable-frontend
  IMAGE_NAME: saspal02/lovable-frontend

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Vite inlines VITE_API_URL at build time, so the prod API URL is baked in here.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./lovable-frontend
          push: true
          tags: docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }},docker.io/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VITE_API_URL=http://api.lovable.in
