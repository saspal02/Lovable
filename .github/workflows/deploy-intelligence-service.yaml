name: Deploy Intelligence Service

on:
  push:
    branches:
      - main
    paths:
      - 'intelligence-service/**'
      - 'common-lib/**'

env:
  SERVICE_NAME: intelligence-service
  IMAGE_NAME: saspal02/lovable-intelligence-service

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy to GKE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # JDK 25, not the tutorial's 21: every pom sets <java.version>25</java.version>,
      # so compiling on 21 fails with "invalid target release: 25".
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # intelligence-service depends on common-lib
      # (com.saswat.lovable:common-lib:1.0.0), so install it first.
      - name: Build and Install Common Lib
        working-directory: ./common-lib
        run: ./mvnw clean install -DskipTests

      - name: Build Jar
        working-directory: ./${{ env.SERVICE_NAME }}
        run: ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # jib-maven-plugin 3.5.2 is configured in this service's pom (base image, ports,
      # target repository), so only the tags are passed here. Credentials come from the
      # login step above, which writes ~/.docker/config.json that jib reads.
      - name: Build and Push Docker Image
        working-directory: ./${{ env.SERVICE_NAME }}
        run: |
          ./mvnw -q jib:build \
            -Djib.to.image=docker.io/${{ env.IMAGE_NAME }} \
            -Djib.to.tags=${{ github.sha }},latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GCP_CLUSTER }}
          location: ${{ secrets.GCP_ZONE }}

      - name: Deploy to GKE
        run: |
          kubectl set image deployment/${{ env.SERVICE_NAME }} \
          ${{ env.SERVICE_NAME }}=${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -n lovable-core

          kubectl rollout status deployment/${{ env.SERVICE_NAME }} -n lovable-core
